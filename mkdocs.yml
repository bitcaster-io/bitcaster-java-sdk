site_name: Bitcaster Java SDK
site_description: Spring-friendly Java client for the Bitcaster notification platform
site_url: https://bitcaster-io.github.io/bitcaster-java-sdk/
repo_url: https://github.com/bitcaster-io/bitcaster-java-sdk
repo_name: bitcaster-io/bitcaster-java-sdk
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Use light mode
  font:
    text: Manrope
    code: DM Mono

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Spring Boot: spring-boot.md
  - API reference: api.md
  - Testing and releases: testing.md